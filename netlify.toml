[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL"

# SPA fallback — serve index.html for any path so client-side routing
# (and direct deep-links / refreshes) don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
